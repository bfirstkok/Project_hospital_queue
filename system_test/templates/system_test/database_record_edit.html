<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>แก้ไข {{ model_label }}</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#eef5f6;color:#173242;font-family:"Sarabun",Tahoma,sans-serif}.wrap{width:min(900px,calc(100% - 30px));margin:18px auto 55px}.head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}.head h1{margin:0;font-size:28px}.muted{color:#66808b;font-size:13px}.card{padding:22px;border:1px solid #d5e4e7;border-radius:16px;background:#fff;box-shadow:0 10px 28px rgba(31,67,78,.07)}form p{display:grid;gap:6px;margin:0 0 15px}label{font-weight:800}input:not([type=checkbox]),select,textarea{width:100%;min-height:43px;padding:9px 11px;border:1px solid #bfd3d7;border-radius:9px;background:#fff;color:#173242;font:inherit}textarea{min-height:90px;resize:vertical}input[type=checkbox]{width:20px;height:20px}.helptext{color:#718792;font-size:11px}.errorlist{margin:0;padding:9px 12px;border-radius:8px;background:#fff0f1;color:#a51d30;list-style:none}.actions{display:flex;justify-content:flex-end;gap:9px;padding-top:6px}.btn{display:inline-flex;min-height:41px;align-items:center;padding:0 15px;border:1px solid #bfd3d7;border-radius:9px;background:#fff;color:#315660;font:800 14px inherit;text-decoration:none;cursor:pointer}.btn.primary{border-color:#087f75;background:#087f75;color:#fff}.warning{margin-bottom:15px;padding:11px 13px;border-radius:9px;background:#fff7df;color:#765400;font-size:12px}
</style></head><body>{% include "includes/main_nav.html" %}<main class="wrap"><header class="head"><div><h1>แก้ไข {{ model_label }}</h1><div class="muted">{{ db_table }} · ID {{ record.pk }}</div></div><a class="btn" href="{% url 'database_table_root' app_label model_name %}">ยกเลิก</a></header><section class="card"><div class="warning">ระบบไม่เปิดให้แก้ไขรหัสผ่าน, token, API key และรหัสลับจากหน้านี้ การเปลี่ยนแปลงจะบันทึกลงฐานข้อมูลจริงทันที</div><form method="post" novalidate>{% csrf_token %}{{ form.as_p }}<div class="actions"><a class="btn" href="{% url 'database_table_root' app_label model_name %}">ไม่บันทึก</a><button class="btn primary" type="submit">บันทึกการแก้ไข</button></div></form></section></main></body></html>
