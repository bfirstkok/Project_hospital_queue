<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{ db_table }}</title><style>*{box-sizing:border-box}body{margin:0;padding:80px 20px 50px;background:#f2f7f8;color:#173242;font-family:Tahoma,sans-serif}.wrap{max-width:1500px;margin:auto}.head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:15px}.head h1{margin:0;font-size:25px}.muted{color:#66808b}.btn{display:inline-flex;padding:9px 13px;border-radius:9px;background:#087f75;color:white;text-decoration:none;font-weight:800}.table-wrap{overflow:auto;border:1px solid #d9e7e9;border-radius:15px;background:#fff;box-shadow:0 8px 24px rgba(31,67,78,.07)}table{border-collapse:collapse;width:100%;font-size:12px}th,td{padding:10px 12px;border-bottom:1px solid #e5edef;text-align:left;white-space:nowrap;max-width:360px;overflow:hidden;text-overflow:ellipsis}th{position:sticky;top:0;background:#eaf5f4;color:#315660}tr:hover td{background:#f8fbfb}</style></head><body>{% include "includes/main_nav.html" %}<main class="wrap"><div class="head"><div><h1>{{ model_label }}</h1><div class="muted">{{ db_table }} · ทั้งหมด {{ total }} แถว · แสดงล่าสุดไม่เกิน 100 แถว</div></div><a class="btn" href="{% url 'system_test:index' %}">กลับศูนย์ทดสอบ</a></div><div class="table-wrap"><table><thead><tr>{% for field in fields %}<th>{{ field.name }}</th>{% endfor %}</tr></thead><tbody>{% for row in rows %}<tr>{% for value in row %}<td title="{{ value }}">{{ value }}</td>{% endfor %}</tr>{% empty %}<tr><td colspan="99">ไม่มีข้อมูล</td></tr>{% endfor %}</tbody></table></div></main></body></html>
