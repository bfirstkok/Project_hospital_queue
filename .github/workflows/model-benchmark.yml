name: Triage model benchmark

on:
  pull_request:
    paths:
      - "ai_triage/**"
      - ".github/workflows/model-benchmark.yml"

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project dependencies
        run: python -m pip install -r requirements.txt

      - name: Install benchmark-only model libraries
        run: python -m pip install xgboost catboost lightgbm

      - name: Run 3-fold triage benchmark
        run: python -m ai_triage.ml.benchmark_models --output-dir ai_triage/reports/model_benchmark

      - name: Print benchmark report
        run: cat ai_triage/reports/model_benchmark/README.md

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: triage-model-benchmark
          path: ai_triage/reports/model_benchmark/
          if-no-files-found: error
