name: Public KTAS Figshare inspection

on:
  pull_request:
    paths:
      - "ai_triage/ml/inspect_public_ktas_dataset.py"
      - ".github/workflows/public-ktas-figshare.yml"
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project and inspection dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install openpyxl pyreadstat requests

      - name: Download public Figshare KTAS dataset
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/ktas
          curl --fail --location --retry 4             "https://api.figshare.com/v2/articles/8044793"             --output /tmp/ktas/article.json

          python - <<'PY'
          import json
          from pathlib import Path
          import requests

          article = json.loads(Path("/tmp/ktas/article.json").read_text())
          files = article.get("files", [])
          print("Article title:", article.get("title"))
          print("Files:", [(f.get("name"), f.get("download_url"), f.get("size")) for f in files])

          if not files:
              raise SystemExit("No files returned by Figshare API")

          for item in files:
              name = item["name"]
              url = item["download_url"]
              out = Path("/tmp/ktas") / name
              with requests.get(url, stream=True, timeout=120) as response:
                  response.raise_for_status()
                  with out.open("wb") as handle:
                      for chunk in response.iter_content(chunk_size=1024 * 1024):
                          if chunk:
                              handle.write(chunk)
              print("Downloaded", out, out.stat().st_size)
          PY

          find /tmp/ktas -maxdepth 2 -type f -printf '%f %s bytes\n'

      - name: Inspect KTAS dataset schema
        run: |
          python -m ai_triage.ml.inspect_public_ktas_dataset             --input-dir /tmp/ktas             --output ai_triage/reports/public_ktas_inspection.json

      - name: Upload aggregate inspection report
        uses: actions/upload-artifact@v4
        with:
          name: public-ktas-inspection
          path: ai_triage/reports/public_ktas_inspection.json
          if-no-files-found: error
