name: Django triage flow tests

on:
  push:
    branches:
      - main
    paths:
      - "queues/**"
      - "patients/**"
      - "opd/**"
      - "ai_triage/**"
      - "config/**"
      - "requirements.txt"
      - "scripts/deploy_production.sh"
      - ".github/workflows/triage-flow-tests.yml"
  pull_request:
    paths:
      - "queues/**"
      - "patients/**"
      - "opd/**"
      - "ai_triage/**"
      - "config/**"
      - "requirements.txt"
      - "scripts/deploy_production.sh"
      - ".github/workflows/triage-flow-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DEBUG: "False"
      SECRET_KEY: "ci-only-not-a-production-secret"
      ALLOWED_HOSTS: "testserver,localhost,127.0.0.1"
      DATABASE_URL: "sqlite"

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Collect static assets with production settings
        run: python manage.py collectstatic --noinput
      - name: Django system check
        run: python manage.py check
      - name: Verify migrations
        run: python manage.py makemigrations --check --dry-run
      - name: Run queue and patient tests
        run: python manage.py test queues patients
