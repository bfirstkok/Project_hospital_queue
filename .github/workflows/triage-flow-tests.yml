name: Django triage flow tests

on:
  push:
    branches:
      - main
    paths:
      - "accounts/**"
      - "queues/**"
      - "patients/**"
      - "opd/**"
      - "ai_triage/**"
      - "config/**"
      - "requirements.txt"
      - "scripts/deploy_production.sh"
      - ".github/workflows/triage-flow-tests.yml"
  pull_request:
    paths:
      - "accounts/**"
      - "queues/**"
      - "patients/**"
      - "opd/**"
      - "ai_triage/**"
      - "config/**"
      - "requirements.txt"
      - "scripts/deploy_production.sh"
      - ".github/workflows/triage-flow-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DEBUG: "False"
      SECRET_KEY: "ci-only-not-a-production-secret"
      ALLOWED_HOSTS: "testserver,localhost,127.0.0.1"
      DATABASE_URL: "sqlite"

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Collect static assets with production settings
        run: python manage.py collectstatic --noinput
      - name: Django system check
        run: python manage.py check
      - name: Verify migrations
        run: python manage.py makemigrations --check --dry-run
      - name: Run account, queue, patient and OPD tests
        run: python manage.py test accounts queues patients opd


  postgres-enum-migration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hospital_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d hospital_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DEBUG: "False"
      SECRET_KEY: "ci-only-not-a-production-secret"
      ALLOWED_HOSTS: "testserver,localhost,127.0.0.1"
      DATABASE_URL: "postgresql://postgres:postgres@127.0.0.1:5432/hospital_test?sslmode=disable"

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Apply migrations on PostgreSQL 17
        run: python manage.py migrate --noinput
      - name: Verify enum definitions
        run: |
          python - <<'PY'
          import os
          os.environ.setdefault("DJANGO_SETTINGS_MODULE", "config.settings")
          import django
          django.setup()
          from django.db import connection

          expected = {
              ("patients_appointment", "status"): "appointment_status_enum",
              ("queues_visit", "final_severity"): "triage_severity_enum",
              ("queues_triageresult", "ai_severity"): "triage_severity_enum",
              ("queues_triageresult", "nurse_severity"): "triage_severity_enum",
              ("queues_queue", "status"): "queue_status_enum",
              ("queues_criticalalert", "severity"): "triage_severity_enum",
              ("queues_criticalalert", "status"): "critical_alert_status_enum",
              ("queues_shiftschedule", "status"): "shift_schedule_status_enum",
              ("opd_visitassessment", "opd_urgency"): "opd_urgency_enum",
          }

          with connection.cursor() as cursor:
              for (table, column), enum_name in expected.items():
                  cursor.execute(
                      """
                      SELECT udt_name
                      FROM information_schema.columns
                      WHERE table_name = %s AND column_name = %s
                      """,
                      [table, column],
                  )
                  row = cursor.fetchone()
                  assert row, f"Missing column {table}.{column}"
                  assert row[0] == enum_name, (
                      f"{table}.{column}: expected {enum_name}, got {row[0]}"
                  )
          print("PostgreSQL native ENUM verification passed")
          PY
