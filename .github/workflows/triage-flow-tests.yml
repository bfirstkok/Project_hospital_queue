name: Django triage flow tests

on:
  pull_request:
    paths:
      - "queues/**"
      - "patients/**"
      - "opd/**"
      - "config/**"
      - "requirements.txt"
      - ".github/workflows/triage-flow-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DEBUG: "True"
      DATABASE_URL: "sqlite"

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Django system check
        run: python manage.py check
      - name: Verify migrations
        run: python manage.py makemigrations --check --dry-run
      - name: Run queue and patient tests
        run: python manage.py test queues patients
