name: Inspect public KTAS Figshare dataset

on:
  pull_request:
    paths:
      - ".github/workflows/ktas-figshare-inspect.yml"
      - "ai_triage/ml/**"
  workflow_dispatch:

jobs:
  inspect-ktas:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install inspection dependencies
        run: python -m pip install pandas openpyxl pyreadstat

      - name: Download public KTAS dataset from Figshare
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/ktas

          urls=(
            "https://plos.figshare.com/ndownloader/articles/7138472/versions/2"
            "https://figshare.com/ndownloader/articles/7138472/versions/2"
            "https://plos.figshare.com/ndownloader/articles/8044793/versions/1"
            "https://figshare.com/ndownloader/articles/8044793/versions/1"
          )

          downloaded=""
          for url in "${urls[@]}"; do
            echo "Trying: $url"
            rm -f /tmp/ktas/ktas_download
            if curl --fail --location --retry 2 --retry-delay 1 "$url" --output /tmp/ktas/ktas_download; then
              bytes="$(stat -c%s /tmp/ktas/ktas_download 2>/dev/null || echo 0)"
              echo "Response bytes: $bytes"
              if [ "$bytes" -gt 0 ]; then
                downloaded="$url"
                break
              fi
              echo "Response was empty; trying next URL."
            fi
          done

          if [ -z "$downloaded" ]; then
            echo "Could not download non-empty Figshare article archive." >&2
            exit 1
          fi

          echo "Downloaded from: $downloaded"
          wc -c /tmp/ktas/ktas_download
          file /tmp/ktas/ktas_download

      - name: Extract and inspect files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/ktas/extracted
          if unzip -t /tmp/ktas/ktas_download >/dev/null 2>&1; then
            unzip -q /tmp/ktas/ktas_download -d /tmp/ktas/extracted
          else
            cp /tmp/ktas/ktas_download /tmp/ktas/extracted/downloaded_file
          fi
          find /tmp/ktas/extracted -maxdepth 3 -type f -printf "%p\t%s bytes\n"

      - name: Inspect tabular structure
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          import pandas as pd

          root = Path("/tmp/ktas/extracted")
          files = [p for p in root.rglob("*") if p.is_file()]
          report = []
          for path in files:
              suffix = path.suffix.lower()
              entry = {"file": str(path), "size": path.stat().st_size}
              try:
                  if suffix in {".csv", ".txt", ".tsv"}:
                      frame = None
                      for kwargs in ({"sep": None, "engine": "python"}, {"sep": ";"}, {"sep": ","}, {"sep": "\t"}):
                          try:
                              candidate = pd.read_csv(path, nrows=20, **kwargs)
                              if candidate.shape[1] > 1:
                                  frame = candidate
                                  break
                          except Exception:
                              pass
                      if frame is not None:
                          entry["kind"] = "table"
                          entry["columns"] = [str(c) for c in frame.columns]
                          entry["preview"] = frame.head(3).astype(str).to_dict(orient="records")
                  elif suffix in {".xlsx", ".xls"}:
                      book = pd.ExcelFile(path)
                      entry["kind"] = "excel"
                      entry["sheets"] = book.sheet_names
                      entry["sheet_columns"] = {}
                      entry["preview"] = {}
                      for sheet in book.sheet_names[:10]:
                          frame = pd.read_excel(path, sheet_name=sheet, nrows=20)
                          entry["sheet_columns"][sheet] = [str(c) for c in frame.columns]
                          entry["preview"][sheet] = frame.head(3).astype(str).to_dict(orient="records")
                  elif suffix == ".sav":
                      frame = pd.read_spss(path)
                      entry["kind"] = "spss"
                      entry["columns"] = [str(c) for c in frame.columns]
                      entry["preview"] = frame.head(3).astype(str).to_dict(orient="records")
                  else:
                      entry["kind"] = "other"
              except Exception as exc:
                  entry["error"] = repr(exc)
              report.append(entry)
          print(json.dumps(report, ensure_ascii=False, indent=2))
          PY
