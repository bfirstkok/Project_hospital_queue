name: Public KTAS 1267 Figshare inspection

on:
  pull_request:
    paths:
      - ".github/workflows/public-ktas-1267.yml"
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install openpyxl pyreadstat requests

      - name: Download Figshare article 9779267
        run: |
          set -euo pipefail
          mkdir -p /tmp/ktas1267
          python - <<'PY'
          import json
          from pathlib import Path
          import requests

          article_id = 9779267
          meta = requests.get(
              f"https://api.figshare.com/v2/articles/{article_id}",
              timeout=120,
          )
          meta.raise_for_status()
          article = meta.json()
          print("TITLE:", article.get("title"))
          print("DESCRIPTION:", article.get("description"))
          print("LICENSE:", article.get("license"))
          print("FILES:")
          for item in article.get("files", []):
              print(item.get("name"), item.get("size"), item.get("download_url"))
              out = Path("/tmp/ktas1267") / item["name"]
              response = requests.get(item["download_url"], stream=True, timeout=120)
              response.raise_for_status()
              with out.open("wb") as handle:
                  for chunk in response.iter_content(1024 * 1024):
                      if chunk:
                          handle.write(chunk)
          PY
          find /tmp/ktas1267 -maxdepth 2 -type f -printf '%p %s bytes\n'

      - name: Inspect schema
        run: |
          python -m ai_triage.ml.inspect_public_ktas_dataset             --input-dir /tmp/ktas1267             --output ai_triage/reports/public_ktas_1267_inspection.json

      - name: Compare with project training data
        run: |
          python - <<'PY'
          import pandas as pd
          from pathlib import Path
          from ai_triage.ml.train_dt import load_clean_dataset

          current = load_clean_dataset()
          print("PROJECT CLEAN ROWS:", len(current))
          print("PROJECT LABEL COUNTS:", current["label"].value_counts().to_dict())

          candidates = [
              p for p in Path("/tmp/ktas1267").rglob("*")
              if p.is_file() and p.suffix.lower() in {".csv", ".xlsx", ".xls", ".sav", ".dta"}
          ]
          print("DOWNLOADED TABULAR FILES:", [p.name for p in candidates])
          PY

      - name: Upload inspection
        uses: actions/upload-artifact@v4
        with:
          name: public-ktas-1267-inspection
          path: ai_triage/reports/public_ktas_1267_inspection.json
          if-no-files-found: error
